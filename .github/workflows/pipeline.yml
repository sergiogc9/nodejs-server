# This is a basic workflow to help you get started with Actions

name: Github Pipeline

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "pipeline"
  pipeline:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # id-token: write is required by npm Trusted Publishing (OIDC).
    # contents: read keeps the rest of the job at minimal scope.
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        node-version: [16.13.1]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --tags
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://npm.pkg.github.com'
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            **/node_modules
          key: ${{ runner.os }}-yarn-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-modules-
            ${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --ignore-scripts --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Quality code check
        run: yarn prettier:check && yarn lint && yarn typescript:check
      - name: Publish to Github
        if: contains(github.ref, 'master')
        run: yarn run publish --yes --no-verify-access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Node 24 ships npm 11+, which detects the OIDC token automatically
      # when Trusted Publishing is configured on the package side. No
      # NODE_AUTH_TOKEN needed for this step.
      - name: Set up node for NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          scope: '@sergiogc9'
      - name: Publish to NPM
        if: contains(github.ref, 'master')
        run: yarn run publish --yes --no-verify-access --ignore-scripts
